<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Bowling Pro - ClickSyncGames</title>
    <link rel="stylesheet" href="classicbowlingpro.css">
</head>
<body>
    <div id="game-wrapper">
        <!-- Brand and Navigation -->
        <header id="csg-header">
            <div id="csg-branding">
                <span class="logo-shield">CSG</span>
                <span id="game-title">Classic Bowling Pro</span>
            </div>
            <div id="csg-navigation">
                <button id="pause-btn" class="btn secondary">Pause</button>
                <button id="return-btn" class="btn primary">Return to ClickSyncGames</button>
            </div>
        </header>

        <div id="main-content">
            <!-- Main Game Canvas -->
            <div id="canvas-container">
                <canvas id="gameCanvas"></canvas>
                
                <!-- On-Screen HUD (Heads Up Display) -->
                <div id="hud" class="hidden">
                    <div class="hud-top">
                        <div class="hud-player-info">
                            <div class="player-color-dot" id="hud-color-dot"></div>
                            <span id="hud-name">Player 1</span>
                            <span class="hud-score-text">Score: <span id="hud-score">0</span></span>
                        </div>
                        <div class="hud-frame-info">
                            Frame <span id="hud-frame">1</span> | Roll <span id="hud-roll">1</span>
                        </div>
                        <button id="show-score-btn" class="btn secondary">View Scoreboard</button>
                    </div>

                    <!-- Interactive On-Screen Meter -->
                    <div id="meter-container" class="hidden">
                        <h3 id="meter-instruction">1. Move Mouse to Position. Click to Lock.</h3>
                        <div id="meter-track" class="hidden">
                            <div id="meter-fill"></div>
                            <div id="meter-cursor"></div>
                            <div id="meter-center-mark"></div>
                        </div>
                    </div>
                </div>

                <!-- Main Menu Overlay -->
                <div id="menu-overlay" class="overlay">
                    <h2>Select Game Mode</h2>
                    <button class="mode-btn" data-players="1">1 Player vs CPU</button>
                    <button class="mode-btn" data-players="2">2 Players</button>
                    <button class="mode-btn" data-players="3">3 Players</button>
                    <button class="mode-btn" data-players="4">4 Players</button>
                </div>

                <!-- Color Selection Overlay -->
                <div id="color-overlay" class="overlay hidden">
                    <h2 id="color-title">Player 1: Select Your Ball Color</h2>
                    <div id="color-options">
                        <div class="color-swatch" data-color="white" style="background: white;"></div>
                        <div class="color-swatch" data-color="grey" style="background: grey;"></div>
                        <div class="color-swatch" data-color="orange" style="background: orange;"></div>
                        <div class="color-swatch" data-color="red" style="background: red;"></div>
                        <div class="color-swatch" data-color="green" style="background: green;"></div>
                        <div class="color-swatch" data-color="blue" style="background: #3498db;"></div>
                        <div class="color-swatch" data-color="purple" style="background: purple;"></div>
                        <div class="color-swatch" data-color="black" style="background: #222; border: 1px solid #555;"></div>
                    </div>
                </div>

                <!-- Full Scoreboard Modal -->
                <div id="scoreboard-modal" class="overlay hidden">
                    <div class="modal-content">
                        <h2>Scoreboard</h2>
                        <div id="scores-container"></div>
                        <button id="close-score-btn" class="btn primary">Back to Game</button>
                    </div>
                </div>

                <!-- Pause Overlay -->
                <div id="pause-overlay" class="overlay hidden">
                    <h2>GAME PAUSED</h2>
                    <button id="resume-btn" class="btn primary">Resume</button>
                </div>

                <!-- Game Over Overlay -->
                <div id="game-over-overlay" class="overlay hidden">
                    <h2>GAME OVER</h2>
                    <h3 id="winner-text"></h3>
                    <div id="final-scores-container"></div>
                    <button id="restart-btn" class="btn primary" style="margin-top: 20px;">Play Again</button>
                </div>
            </div>
        </div>
    </div>
    <script src="classicbowlingpro.js"></script>
</body>
</html>
