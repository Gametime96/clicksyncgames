<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Bowling Pro - ClickSyncGames</title>
    <link rel="stylesheet" href="classicbowlingpro.css">
</head>
<body>
    <div id="game-wrapper">
        <header id="csg-header">
            <div id="csg-branding">
                <span class="logo-shield">CSG</span>
                <span id="game-title">Classic Bowling Pro</span>
            </div>
            <div id="csg-navigation">
                <button id="pause-btn" class="btn secondary">Pause</button>
                <button id="return-btn" class="btn primary">Return to ClickSyncGames</button>
            </div>
        </header>

        <div id="main-content">
            <div id="canvas-container">
                <canvas id="gameCanvas"></canvas>
                
                <!-- Heads Up Display (HUD) -->
                <div id="hud" class="hidden">
                    <div class="hud-top">
                        <div class="hud-player-info">
                            <div class="player-color-dot" id="hud-color-dot"></div>
                            <span id="hud-name">Player 1</span>
                            <span class="hud-score-text">Score: <span id="hud-score">0</span></span>
                        </div>
                        <div class="hud-frame-info">
                            Frame <span id="hud-frame">1</span> | Roll <span id="hud-roll">1</span>
                        </div>
                        <button id="show-score-btn" class="btn secondary">View Scoreboard</button>
                    </div>

                    <!-- 4-Step Interactive Meter -->
                    <div id="meter-container" class="hidden">
                        <h3 id="meter-instruction">1. Move Mouse to Position. Click to Lock.</h3>
                        <div id="meter-track" class="hidden">
                            <div id="meter-fill"></div>
                            <div id="meter-cursor"></div>
                            <div id="meter-center-mark"></div>
                        </div>
                    </div>
                </div>

                <!-- On-Screen Steering Controls -->
                <div id="steer-controls" class="hidden">
                    <button id="steer-left" class="steer-btn">⬅️</button>
                    <button id="steer-right" class="steer-btn">➡️</button>
                </div>

                <!-- Main Menu Overlay -->
                <div id="menu-overlay" class="overlay">
                    <div class="menu-box">
                        <h2>Select Game Mode</h2>
                        
                        <div class="pin-style-selector">
                            <h3 style="color:#fff; margin-bottom:10px; font-size:1.1rem;">Select Pin Style</h3>
                            <div style="display:flex; justify-content:center; gap: 20px; margin-bottom: 20px; color:#fff;">
                                <label><input type="radio" name="pinstyle" value="1" checked> Classic Bottle</label>
                                <label><input type="radio" name="pinstyle" value="2"> Modern Thick</label>
                            </div>
                        </div>

                        <!-- Ensure these data attributes exist for JS to read -->
                        <button class="mode-btn" data-players="1">1 Player vs CPU</button>
                        <button class="mode-btn" data-players="2">2 Players</button>
                        <button class="mode-btn" data-players="3">3 Players</button>
                        <button class="mode-btn" data-players="4">4 Players</button>
                    </div>
                </div>

                <!-- Color Selection Overlay -->
                <div id="color-overlay" class="overlay hidden">
                    <div class="menu-box">
                        <h2 id="color-title">Player 1: Select Your Ball Color</h2>
                        <div id="color-options">
                            <div class="color-swatch" data-color="#ecf0f1" style="background: radial-gradient(circle at 30% 30%, #ffffff, #bdc3c7);"></div>
                            <div class="color-swatch" data-color="#7f8c8d" style="background: radial-gradient(circle at 30% 30%, #bdc3c7, #34495e);"></div>
                            <div class="color-swatch" data-color="#e67e22" style="background: radial-gradient(circle at 30% 30%, #f39c12, #d35400);"></div>
                            <div class="color-swatch" data-color="#e74c3c" style="background: radial-gradient(circle at 30% 30%, #ff7675, #c0392b);"></div>
                            <div class="color-swatch" data-color="#2ecc71" style="background: radial-gradient(circle at 30% 30%, #55efc4, #27ae60);"></div>
                            <div class="color-swatch" data-color="#3498db" style="background: radial-gradient(circle at 30% 30%, #74b9ff, #2980b9);"></div>
                            <div class="color-swatch" data-color="#9b59b6" style="background: radial-gradient(circle at 30% 30%, #a29bfe, #8e44ad);"></div>
                            <div class="color-swatch" data-color="#111111" style="background: radial-gradient(circle at 30% 30%, #555555, #000000); border: 1px solid #444;"></div>
                        </div>
                    </div>
                </div>

                <!-- Scoreboard Modal -->
                <div id="scoreboard-modal" class="overlay hidden">
                    <div class="modal-content">
                        <h2>Scoreboard</h2>
                        <div id="scores-container"></div>
                        <button id="close-score-btn" class="btn primary" style="margin-top: 20px;">Back to Game</button>
                    </div>
                </div>

                <!-- Pause Overlay -->
                <div id="pause-overlay" class="overlay hidden">
                    <div class="menu-box">
                        <h2>GAME PAUSED</h2>
                        <button id="resume-btn" class="btn primary">Resume</button>
                    </div>
                </div>

                <!-- Game Over Overlay -->
                <div id="game-over-overlay" class="overlay hidden">
                    <div class="menu-box">
                        <h2>GAME OVER</h2>
                        <h3 id="winner-text" style="color: #2ecc71; margin-bottom: 20px; font-size: 2rem;"></h3>
                        <div id="final-scores-container"></div>
                        <button id="restart-btn" class="btn primary" style="margin-top: 30px;">Play Again</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="classicbowlingpro.js"></script>
</body>
</html>
