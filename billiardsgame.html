<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Play Classic Billiards Online | Free Pool Physics Simulator</title>
    <meta name="description" content="Line up your shots and clear the table in this free physics-based pool simulator. Practice your billiards geometry and trick shots directly in your browser.">
    <link rel="stylesheet" href="billiardsgame.css">
</head>
<body>

    <div class="landscape-warning">
        ⚠️ For the best experience, please rotate your device to Landscape mode.
    </div>

    <header class="top-nav">
        <a href="https://clicksyncgames.com/" class="return-btn" title="Return to ClickSync Games">
            <span>Return to</span>
            <img src="clicksyncgameslogo.jpeg" alt="ClickSync Games Logo" class="nav-logo">
        </a>

        <div class="nav-controls">
            <button id="cancelAimBtn" class="control-btn cancel-btn hidden" type="button">Cancel Aim</button>
            <button id="pauseBtn" class="control-btn" type="button" title="Pause or Resume (P)">⏸ Pause (P)</button>
            <button id="muteBtn" class="control-btn" type="button" title="Mute or Unmute Audio">🔊 Sound On</button>
        </div>
    </header>

    <main class="canvas-container">
        <canvas id="gameCanvas" width="880" height="640"></canvas>
    </main>

    <script src="billiardsgame.js"></script>
</body>
</html>
