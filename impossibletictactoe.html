<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Impossible Tic Tac Toe</title>
    <link rel="stylesheet" href="impossibletictactoe.css">
</head>
<body>
    <div id="portrait-warning">For best user experience rotate mobile device to landscape orientation</div>

    <div id="top-bar">
        <button id="pause-btn" class="top-btn">Pause</button>
        <button id="return-btn" class="top-btn" onclick="window.location.href='index.html'">Return to ClickSyncGames</button>
    </div>

    <div class="container">
        <h1 id="main-title">Impossible Tic Tac Toe</h1>
        
        <div id="setup-menu" class="menu-card">
            <h2>Select Game Mode</h2>
            
            <div id="mode-selection" class="button-group">
                <button class="mode-btn" data-mode="pvc-easy">Player vs Computer - Easy</button>
                <button class="mode-btn" data-mode="pvc-medium">Player vs Computer - Medium</button>
                <button class="mode-btn" data-mode="pvc-difficult">Player vs Computer - Difficult</button>
                <button class="mode-btn" data-mode="pvp">Player vs Player</button>
            </div>

            <div id="pvc-setup" class="hidden setup-details">
                <h3>Choose your piece:</h3>
                <div class="button-group">
                    <button class="start-btn" data-piece="X">Play as X</button>
                    <button class="start-btn" data-piece="O">Play as O</button>
                </div>
                <button class="back-btn btn-secondary">Back</button>
            </div>

            <div id="pvp-setup" class="hidden setup-details">
                <h3>Enter Player Names:</h3>
                <input type="text" id="p1-name" placeholder="Player 1 (Plays X)" maxlength="15">
                <input type="text" id="p2-name" placeholder="Player 2 (Plays O)" maxlength="15">
                <div class="button-group">
                    <button id="start-pvp-btn" class="btn">Start Game</button>
                </div>
                <button class="back-btn btn-secondary">Back</button>
            </div>
        </div>

        <div id="game-interface" class="hidden">
            <h2 id="status-text">Player X's Turn</h2>
            
            <div id="board-container">
                <div id="board" class="board">
                    <div class="cell" data-index="0"></div>
                    <div class="cell" data-index="1"></div>
                    <div class="cell" data-index="2"></div>
                    <div class="cell" data-index="3"></div>
                    <div class="cell" data-index="4"></div>
                    <div class="cell" data-index="5"></div>
                    <div class="cell" data-index="6"></div>
                    <div class="cell" data-index="7"></div>
                    <div class="cell" data-index="8"></div>
                </div>
                <div id="win-line-container" class="hidden">
                    <svg id="win-line-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
                        <line id="win-line" x1="0" y1="0" x2="0" y2="0" stroke="white" stroke-width="3" stroke-dasharray="5,4" stroke-linecap="round"/>
                    </svg>
                </div>
                <div id="pause-overlay" class="hidden">
                    <h2>Game Paused</h2>
                    <button id="resume-btn" class="btn">Resume</button>
                </div>
            </div>

            <div class="controls button-group">
                <button id="restart-btn" class="btn hidden">Play Again</button>
                <button id="menu-btn" class="btn btn-secondary">Back to Menu</button>
            </div>
        </div>
    </div>

    <script src="impossibletictactoe.js"></script>
</body>
</html>
