<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Train Track Madness Pro</title>
    <style>
        :root {
            --grid-size: 10;
            --cell-bg: #34495e;
            --track-color: #7f8c8d;
            --rail-color: #bdc3c7;
            --smoke-color: rgba(236, 240, 241, 0.6);
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #1a252f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
            color: #ecf0f1;
        }

        /* Cinematic Overlay */
        #cinematic-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0);
            z-index: 200;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: background 1s ease;
        }

        #cinematic-text {
            color: #bdc3c7;
            font-size: 24px;
            text-align: center;
            max-width: 80%;
            opacity: 0;
            transition: opacity 1s ease;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }

        .cinematic-active #cinematic-overlay {
            background: rgba(0, 0, 0, 0.7);
            pointer-events: all;
        }

        /* Tutorial Arrow */
        #tutorial-arrow {
            position: absolute;
            font-size: 50px;
            color: #f1c40f;
            z-index: 250;
            display: none;
            filter: drop-shadow(0 0 10px black);
            pointer-events: none;
        }

        /* Standard UI */
        #ui-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: rgba(0,0,0,0.6);
            z-index: 10;
        }

        #game-board {
            position: relative;
            width: 85vmin;
            height: 85vmin;
            background: #34495e;
            border: 4px solid #1abc9c;
            border-radius: 4px;
            transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #grid {
            display: grid;
            width: 100%;
            height: 100%;
            grid-template-columns: repeat(var(--grid-size), 1fr);
            grid-template-rows: repeat(var(--grid-size), 1fr);
        }

        .cell {
            width: 100%; height: 100%;
            border: 1px solid rgba(255, 255, 255, 0.03);
            position: relative;
            cursor: pointer;
        }

        /* Track Styles */
        .track { background: var(--track-color); position: relative; }
        .track::before, .track::after {
            content: ''; position: absolute; background: var(--rail-color);
        }
        .track::before { top: 25%; left: 0; right: 0; height: 3px; }
        .track::after { bottom: 25%; left: 0; right: 0; height: 3px; }
        .tr-v::before { top: 0; bottom: 0; left: 25%; width: 3px; height: auto; }
        .tr-v::after { top: 0; bottom: 0; right: 25%; width: 3px; height: auto; }
        .tr-c-se::before { top: 25%; left: 25%; right: 0; height: 3px; width: auto; }
        .tr-c-se::after { top: 25%; left: 25%; bottom: 0; width: 3px; height: auto; } 

        /* Train */
        #train {
            position: absolute; width: calc(100% / var(--grid-size)); height: calc(100% / var(--grid-size));
            z-index: 10; transition-timing-function: linear;
        }
        #train-body {
            width: 80%; height: 60%; background: #c0392b; border-radius: 4px;
            margin: 20% 10%; position: relative;
        }

        .passenger {
            position: absolute; width: 40%; height: 40%; top: 30%; left: 30%;
            background: #f1c40f; border-radius: 50%; box-shadow: 0 0 10px #f1c40f;
            animation: pulse 0.6s infinite alternate;
        }
        @keyframes pulse { from { transform: scale(0.8); } to { transform: scale(1.1); } }

        #modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: none; justify-content: center; align-items: center; z-index: 500;
        }
        #modal { background: #2c3e50; padding: 40px; border-radius: 15px; text-align: center; border: 2px solid #1abc9c; }
        .modal-btn { padding: 15px 30px; background: #1abc9c; border: none; color: white; cursor: pointer; font-size: 1.2rem; margin-top: 20px; }
    </style>
</head>
<body class="cinematic-active">

    <div id="cinematic-overlay">
        <div id="cinematic-text"></div>
    </div>
    <div id="tutorial-arrow">➔</div>

    <div id="ui-bar">
        <div>LEVEL: <span id="level-display">1</span></div>
        <div>TRACKS AVAILABLE: <span id="track-count">0</span> / 18</div>
    </div>

    <div id="game-board">
        <div id="grid"></div>
        <div id="train" style="display: none;">
            <div id="train-body"></div>
        </div>
    </div>

    <div id="modal-overlay">
        <div id="modal">
            <h1 id="modal-title"></h1>
            <p id="modal-text"></p>
            <button class="modal-btn" onclick="modalAction()">CONTINUE</button>
        </div>
    </div>

    <script>
        const gridSize = 10;
        const TRACK_LIMIT = 18;
        let grid = [];
        let level = 1;
        let trackInventory = 0;
        let train = { x: 0, y: 0, dx: 0, dy: 1 };
        let passengers = [];
        let isPlaying = false;
        let gameLoop = null;
        let pendingAction = null;

        const gridEl = document.getElementById('grid');
        const boardEl = document.getElementById('game-board');
        const trainEl = document.getElementById('train');

        function initGrid() {
            gridEl.innerHTML = '';
            grid = [];
            for (let y = 0; y < gridSize; y++) {
                let row = [];
                for (let x = 0; x < gridSize; x++) {
                    let cellEl = document.createElement('div');
                    cellEl.className = 'cell';
                    cellEl.onclick = () => handleCellClick(x, y);
                    gridEl.appendChild(cellEl);
                    row.push({ hasTrack: false, el: cellEl });
                }
                grid.push(row);
            }
        }

        function handleCellClick(x, y) {
            if (!isPlaying || document.body.classList.contains('cinematic-active')) return;
            const cell = grid[y][x];
            
            // Total tracks currently on board
            let tracksOnBoard = grid.flat().filter(c => c.hasTrack).length;

            if (cell.hasTrack) {
                cell.hasTrack = false;
            } else {
                if (tracksOnBoard < TRACK_LIMIT) {
                    cell.hasTrack = true;
                } else {
                    // Flash the board red briefly to show limit reached
                    boardEl.style.borderColor = '#e74c3c';
                    setTimeout(() => boardEl.style.borderColor = '#1abc9c', 200);
                    return;
                }
            }
            updateGridConnections();
            updateUI();
        }

        async function cinematicScene(text, zoomTarget = null) {
            document.body.classList.add('cinematic-active');
            const txtEl = document.getElementById('cinematic-text');
            txtEl.innerHTML = text;
            
            if (zoomTarget) {
                const {x, y} = zoomTarget;
                boardEl.style.transform = `scale(2.5) translate(${(4.5-x)*10}%, ${(4.5-y)*10}%)`;
            }

            txtEl.style.opacity = 1;
            await new Promise(r => setTimeout(r, 4000));
            txtEl.style.opacity = 0;
            await new Promise(r => setTimeout(r, 1000));
            
            boardEl.style.transform = 'scale(1) translate(0,0)';
            document.body.classList.remove('cinematic-active');
        }

        function updateGridConnections() {
            grid.forEach((row, y) => {
                row.forEach((cell, x) => {
                    cell.el.className = 'cell';
                    if (!cell.hasTrack) return;
                    cell.el.classList.add('track');
                    const n = (y > 0 && grid[y-1][x].hasTrack);
                    const s = (y < gridSize-1 && grid[y+1][x].hasTrack);
                    const e = (x < gridSize-1 && grid[y][x+1].hasTrack);
                    const w = (x > 0 && grid[y][x-1].hasTrack);
                    if (n && s) cell.el.classList.add('tr-v');
                    if (s && e) cell.el.classList.add('tr-c-se');
                });
            });
        }

        async function loadLevel(lvl) {
            level = lvl;
            initGrid();
            
            if (lvl === 1) {
                // Level 1: 17 tracks on perimeter, 1 in center = 18 total.
                // One gap left at (0, 8) to be filled.
                for(let i=0; i<9; i++) grid[i][0].hasTrack = true; // Left side (gap at 0,9)
                for(let i=0; i<8; i++) grid[9][i].hasTrack = true; // Bottom
                grid[5][5].hasTrack = true; // The "useless" center track
                
                train = { x: 0, y: 0, dx: 0, dy: 1 };
                passengers = [{x: 0, y: 9}];
                
                updateGridConnections();
                drawPassengers();
                updateUI();
                updateTrainVisuals(true);

                await cinematicScene("Welcome to Train Track Madness.<br>The grid is tight. You only have 18 tracks.");
                await cinematicScene("Notice the gap in the perimeter?", {x: 0, y: 9});
                
                // Tutorial Animation: Drag center track to gap
                const arrow = document.getElementById('tutorial-arrow');
                arrow.style.display = 'block';
                arrow.style.left = '55%'; arrow.style.top = '55%';
                
                await new Promise(r => setTimeout(r, 500));
                arrow.style.transition = "all 2s ease";
                arrow.style.left = '5%'; arrow.style.top = '95%';
                
                await new Promise(r => setTimeout(r, 2000));
                grid[5][5].hasTrack = false;
                grid[9][0].hasTrack = true;
                updateGridConnections();
                updateUI();
                arrow.style.display = 'none';
                
                await cinematicScene("Route connected. Commencing transit.");
            } else {
                // Random passengers for level 2+
                for(let i=0; i<lvl+1; i++) {
                    passengers.push({x: Math.floor(Math.random()*8)+1, y: Math.floor(Math.random()*8)+1});
                }
                drawPassengers();
            }
            
            isPlaying = true;
            runGameLoop();
        }

        function runGameLoop() {
            if (!isPlaying) return;
            moveTrain();
            gameLoop = setTimeout(runGameLoop, 600);
        }

        function moveTrain() {
            let nextX = train.x + train.dx;
            let nextY = train.y + train.dy;

            // Simple AI: check straight, then left, then right
            const hasTrack = (x, y) => x>=0 && x<gridSize && y>=0 && y<gridSize && grid[y][x].hasTrack;

            if (!hasTrack(nextX, nextY)) {
                let lDx = train.dy, lDy = -train.dx;
                let rDx = -train.dy, rDy = train.dx;
                if (hasTrack(train.x + lDx, train.y + lDy)) { train.dx = lDx; train.dy = lDy; }
                else if (hasTrack(train.x + rDx, train.y + rDy)) { train.dx = rDx; train.dy = rDy; }
                else { derail(); return; }
            }

            train.x += train.dx;
            train.y += train.dy;
            updateTrainVisuals();

            const pIdx = passengers.findIndex(p => p.x === train.x && p.y === train.y);
            if (pIdx !== -1) {
                passengers.splice(pIdx, 1);
                drawPassengers();
                if (passengers.length === 0) winLevel();
            }
        }

        function derail() {
            isPlaying = false;
            showModal("DERAILED", "Out of tracks! You must recycle tracks from behind the train to build ahead.", () => location.reload());
        }

        function winLevel() {
            isPlaying = false;
            showModal("LEVEL COMPLETE", "Route cleared. Prepare for increased complexity.", () => loadLevel(level + 1));
        }

        function updateTrainVisuals(instant = false) {
            trainEl.style.display = 'block';
            trainEl.style.transition = instant ? 'none' : 'all 0.6s linear';
            trainEl.style.left = `${(train.x / gridSize) * 100}%`;
            trainEl.style.top = `${(train.y / gridSize) * 100}%`;
        }

        function drawPassengers() {
            document.querySelectorAll('.passenger').forEach(p => p.remove());
            passengers.forEach(p => {
                const pEl = document.createElement('div');
                pEl.className = 'passenger';
                grid[p.y][p.x].el.appendChild(pEl);
            });
        }

        function updateUI() {
            const count = grid.flat().filter(c => c.hasTrack).length;
            document.getElementById('track-count').innerText = count;
            document.getElementById('level-display').innerText = level;
        }

        function showModal(title, text, action) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-text').innerText = text;
            document.getElementById('modal-overlay').style.display = 'flex';
            pendingAction = action;
        }

        function modalAction() {
            document.getElementById('modal-overlay').style.display = 'none';
            if (pendingAction) pendingAction();
        }

        window.onload = () => loadLevel(1);
    </script>
</body>
</html>
