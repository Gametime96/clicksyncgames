<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Train Track Madness Pro</title>
    <style>
        :root {
            --grid-size: 10;
            --cell-bg: #34495e;
            --track-color: #7f8c8d;
            --rail-color: #bdc3c7;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #1a252f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
            color: #ecf0f1;
        }

        /* Cinematic Overlay */
        #cinematic-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0);
            z-index: 200;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: background 1s ease;
        }

        #cinematic-text {
            color: #bdc3c7;
            font-size: 24px;
            text-align: center;
            max-width: 80%;
            opacity: 0;
            transition: opacity 1s ease;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }

        .cinematic-active #cinematic-overlay {
            background: rgba(0, 0, 0, 0.8);
            pointer-events: all;
        }

        /* Tutorial Arrow */
        #tutorial-arrow {
            position: absolute;
            font-size: 45px;
            color: #f1c40f;
            z-index: 250;
            display: none;
            filter: drop-shadow(0 0 10px black);
            pointer-events: none;
            transform: translate(-50%, -50%);
        }

        /* Standard UI */
        #ui-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: rgba(0,0,0,0.7);
            z-index: 10;
            font-weight: bold;
            letter-spacing: 1px;
            border-bottom: 2px solid #1abc9c;
        }

        #track-count-display {
            transition: color 0.3s;
        }
        .limit-reached { color: #e74c3c !important; }

        #game-board {
            position: relative;
            width: 85vmin;
            height: 85vmin;
            background: #34495e;
            border: 4px solid #1abc9c;
            border-radius: 4px;
            transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.3s;
        }

        #grid {
            display: grid;
            width: 100%;
            height: 100%;
            grid-template-columns: repeat(var(--grid-size), 1fr);
            grid-template-rows: repeat(var(--grid-size), 1fr);
        }

        .cell {
            width: 100%; height: 100%;
            border: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
            cursor: pointer;
            transition: background 0.2s;
        }
        .cell:hover { background: rgba(255, 255, 255, 0.08); }

        /* Perfected Track & Corner Styles */
        .track { background: var(--track-color); position: relative; }
        .track::before, .track::after {
            content: ''; position: absolute; box-sizing: border-box; background: transparent; pointer-events: none;
        }

        /* Horizontal Rails */
        .tr-h::before { top: 25%; left: 0; width: 100%; height: 4px; background: var(--rail-color); }
        .tr-h::after { bottom: 25%; left: 0; width: 100%; height: 4px; background: var(--rail-color); }

        /* Vertical Rails (Equidistant Center) */
        .tr-v::before { left: 25%; top: 0; width: 4px; height: 100%; background: var(--rail-color); }
        .tr-v::after { right: 25%; top: 0; width: 4px; height: 100%; background: var(--rail-color); }

        /* 90-Degree Corners */
        /* South-East Curve */
        .tr-se::before { bottom: 0; right: 0; width: 25%; height: 25%; border-top-left-radius: 100%; border-top: 4px solid var(--rail-color); border-left: 4px solid var(--rail-color); }
        .tr-se::after { bottom: 0; right: 0; width: 75%; height: 75%; border-top-left-radius: 100%; border-top: 4px solid var(--rail-color); border-left: 4px solid var(--rail-color); }

        /* South-West Curve */
        .tr-sw::before { bottom: 0; left: 0; width: 25%; height: 25%; border-top-right-radius: 100%; border-top: 4px solid var(--rail-color); border-right: 4px solid var(--rail-color); }
        .tr-sw::after { bottom: 0; left: 0; width: 75%; height: 75%; border-top-right-radius: 100%; border-top: 4px solid var(--rail-color); border-right: 4px solid var(--rail-color); }

        /* North-East Curve */
        .tr-ne::before { top: 0; right: 0; width: 25%; height: 25%; border-bottom-left-radius: 100%; border-bottom: 4px solid var(--rail-color); border-left: 4px solid var(--rail-color); }
        .tr-ne::after { top: 0; right: 0; width: 75%; height: 75%; border-bottom-left-radius: 100%; border-bottom: 4px solid var(--rail-color); border-left: 4px solid var(--rail-color); }

        /* North-West Curve */
        .tr-nw::before { top: 0; left: 0; width: 25%; height: 25%; border-bottom-right-radius: 100%; border-bottom: 4px solid var(--rail-color); border-right: 4px solid var(--rail-color); }
        .tr-nw::after { top: 0; left: 0; width: 75%; height: 75%; border-bottom-right-radius: 100%; border-bottom: 4px solid var(--rail-color); border-right: 4px solid var(--rail-color); }


        /* Train Visals (Classic Iron Horse) */
        #train-wrapper {
            position: absolute; 
            width: calc(100% / var(--grid-size)); 
            height: calc(100% / var(--grid-size));
            z-index: 20; 
            /* Linear for movement, ease-in-out for smooth pivot rotation */
            transition: transform 0.8s ease-in-out, left 0.8s linear, top 0.8s linear;
            display: flex; justify-content: center; align-items: center;
        }

        #train-body {
            width: 70%; height: 85%; 
            background: linear-gradient(to right, #111, #333 30%, #333 70%, #111); 
            border-radius: 50% 50% 10% 10%;
            position: relative;
            box-shadow: inset 0 0 8px #000, 0 5px 10px rgba(0,0,0,0.6);
            display: flex; flex-direction: column; align-items: center;
            border: 1px solid #000;
        }

        /* Front Cowcatcher / Grill */
        #train-body::before {
            content: ''; position: absolute;
            top: -6px; width: 60%; height: 10px;
            background: #c0392b;
            clip-path: polygon(20% 0, 80% 0, 100% 100%, 0 100%);
            border-bottom: 2px solid #000;
        }

        /* Smokestack */
        .smokestack {
            width: 18px; height: 18px;
            background: #000; border-radius: 50%;
            border: 3px solid #7f8c8d;
            margin-top: 5px;
            box-shadow: inset 0 0 5px #000;
            z-index: 2;
        }

        /* Gold Dome / Detail */
        .dome {
            width: 12px; height: 12px;
            background: #f1c40f; border-radius: 50%;
            margin-top: 10px;
            box-shadow: inset -2px -2px 4px rgba(0,0,0,0.5);
        }

        /* Rear Cabin */
        .cabin {
            width: 90%; height: 35%;
            background: #8e44ad;
            position: absolute; bottom: 3px;
            border-radius: 4px;
            border: 2px solid #f1c40f;
            box-shadow: inset 0 0 5px #000;
        }

        /* Moving Red Side Rods */
        .side-rod {
            position: absolute; width: 4px; height: 60%;
            background: #e74c3c;
            top: 20%;
            z-index: 25;
            box-shadow: 1px 1px 3px #000;
            border-radius: 2px;
        }
        .side-rod.left { left: -5px; }
        .side-rod.right { right: -5px; }

        @keyframes pump {
            0% { transform: translateY(-6px); }
            50% { transform: translateY(6px); }
            100% { transform: translateY(-6px); }
        }
        .is-moving .side-rod { animation: pump 0.5s infinite linear; }

        /* Smoke Particles */
        .smoke-particle {
            position: absolute;
            width: 15px; height: 15px;
            background: rgba(189, 195, 199, 0.8);
            border-radius: 50%;
            pointer-events: none;
            z-index: 15;
            transform: translate(-50%, -50%) scale(1);
            animation: smokeDrift 1.5s forwards ease-out;
            filter: blur(1px);
        }
        @keyframes smokeDrift {
            100% { transform: translate(-50%, -50%) scale(3); opacity: 0; filter: blur(3px); }
        }

        /* Passengers */
        .passenger {
            position: absolute; width: 40%; height: 40%; top: 30%; left: 30%;
            background: #f1c40f; border-radius: 50%; box-shadow: 0 0 10px #f1c40f;
            animation: pulse 0.6s infinite alternate;
            z-index: 5;
        }
        @keyframes pulse { from { transform: scale(0.8); } to { transform: scale(1.1); } }

        /* Modals */
        #modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: none; justify-content: center; align-items: center; z-index: 500;
        }
        #modal { background: #2c3e50; padding: 40px; border-radius: 15px; text-align: center; border: 2px solid #1abc9c; max-width: 80%; }
        .modal-btn { padding: 15px 30px; background: #1abc9c; border: none; color: white; cursor: pointer; font-size: 1.2rem; margin-top: 20px; font-weight: bold; border-radius: 5px;}
        .modal-btn:hover { background: #16a085; }
    </style>
</head>
<body class="cinematic-active">

    <div id="cinematic-overlay">
        <div id="cinematic-text"></div>
    </div>
    <div id="tutorial-arrow">➔</div>

    <div id="ui-bar">
        <div>LEVEL <span id="level-display">1</span></div>
        <div id="track-count-display">TRACKS: <span id="track-count">0</span> / 18</div>
    </div>

    <div id="game-board">
        <div id="grid"></div>
        <div id="train-wrapper" style="display: none;">
            <div id="train-body">
                <div class="smokestack"></div>
                <div class="dome"></div>
                <div class="cabin"></div>
                <div class="side-rod left"></div>
                <div class="side-rod right"></div>
            </div>
        </div>
    </div>

    <div id="modal-overlay">
        <div id="modal">
            <h1 id="modal-title"></h1>
            <p id="modal-text"></p>
            <button class="modal-btn" onclick="modalAction()">CONTINUE</button>
        </div>
    </div>

    <script>
        const gridSize = 10;
        const TRACK_LIMIT = 18;
        let grid = [];
        let level = 1;
        let train = { x: 0, y: 0, dx: 0, dy: -1, rot: 0 }; 
        let passengers = [];
        let isPlaying = false;
        let moveTimeout = null;
        let smokeInterval = null;
        let pendingAction = null;

        const gridEl = document.getElementById('grid');
        const boardEl = document.getElementById('game-board');
        const trainEl = document.getElementById('train-wrapper');
        const trainBody = document.getElementById('train-body');

        function initGrid() {
            gridEl.innerHTML = '';
            grid = [];
            for (let y = 0; y < gridSize; y++) {
                let row = [];
                for (let x = 0; x < gridSize; x++) {
                    let cellEl = document.createElement('div');
                    cellEl.className = 'cell';
                    cellEl.onclick = () => handleCellClick(x, y);
                    gridEl.appendChild(cellEl);
                    row.push({ hasTrack: false, el: cellEl });
                }
                grid.push(row);
            }
        }

        function handleCellClick(x, y) {
            if (!isPlaying || document.body.classList.contains('cinematic-active')) return;
            const cell = grid[y][x];
            
            let tracksOnBoard = grid.flat().filter(c => c.hasTrack).length;

            if (cell.hasTrack) {
                cell.hasTrack = false;
            } else {
                if (tracksOnBoard < TRACK_LIMIT) {
                    cell.hasTrack = true;
                } else {
                    boardEl.style.borderColor = '#e74c3c';
                    document.getElementById('track-count-display').classList.add('limit-reached');
                    setTimeout(() => {
                        boardEl.style.borderColor = '#1abc9c';
                        document.getElementById('track-count-display').classList.remove('limit-reached');
                    }, 300);
                    return;
                }
            }
            updateGridConnections();
            updateUI();
        }

        async function cinematicScene(text, zoomTarget = null) {
            document.body.classList.add('cinematic-active');
            const txtEl = document.getElementById('cinematic-text');
            txtEl.innerHTML = text;
            
            if (zoomTarget) {
                const {x, y} = zoomTarget;
                boardEl.style.transform = `scale(2) translate(${(4.5-x)*8}%, ${(4.5-y)*8}%)`;
            }

            txtEl.style.opacity = 1;
            await new Promise(r => setTimeout(r, 4500));
            txtEl.style.opacity = 0;
            await new Promise(r => setTimeout(r, 1000));
            
            boardEl.style.transform = 'scale(1) translate(0,0)';
            document.body.classList.remove('cinematic-active');
        }

        function updateGridConnections() {
            grid.forEach((row, y) => {
                row.forEach((cell, x) => {
                    cell.el.className = 'cell';
                    if (!cell.hasTrack) return;
                    cell.el.classList.add('track');

                    const n = (y > 0 && grid[y-1][x].hasTrack);
                    const s = (y < gridSize-1 && grid[y+1][x].hasTrack);
                    const e = (x < gridSize-1 && grid[y][x+1].hasTrack);
                    const w = (x > 0 && grid[y][x-1].hasTrack);

                    // Dynamically map proper 90-degree corners and straights
                    if (n && e) cell.el.classList.add('tr-ne');
                    else if (n && w) cell.el.classList.add('tr-nw');
                    else if (s && e) cell.el.classList.add('tr-se');
                    else if (s && w) cell.el.classList.add('tr-sw');
                    else if (n && s) cell.el.classList.add('tr-v');
                    else if (e && w) cell.el.classList.add('tr-h');
                    else if (n || s) cell.el.classList.add('tr-v'); // Isolated track with vertical neighbor aligns vertically
                    else cell.el.classList.add('tr-h'); // Defaults to horizontal
                });
            });
        }

        async function loadLevel(lvl) {
            level = lvl;
            initGrid();
            
            if (lvl === 1) {
                const level1Tracks = [
                    [3,2], [4,2], [5,2], [6,2], [7,2], // Top edge
                    [7,3], [7,4], [7,5], [7,6], [7,7], // Right edge
                    [6,7], [5,7], [4,7], [3,7], [2,7], // Bottom edge
                    [2,6], [2,5]                       // Left edge leading to gap
                ];
                
                level1Tracks.forEach(coord => { grid[coord[1]][coord[0]].hasTrack = true; });
                grid[4][5].hasTrack = true; // Decoy
                
                // Train facing East (90 deg)
                train = { x: 3, y: 2, dx: 1, dy: 0, rot: 90 };
                passengers = [{x: 2, y: 3}];
                
                updateGridConnections();
                drawPassengers();
                updateUI();
                updateTrainVisuals(true);

                await cinematicScene("Welcome to Train Track Madness Pro.<br>You have exactly 18 tracks to secure the route.");
                await cinematicScene("Notice the gap in the perimeter?", {x: 2, y: 4});
                
                const arrow = document.getElementById('tutorial-arrow');
                arrow.style.display = 'block';
                arrow.style.transition = "none";
                arrow.style.left = '55%'; arrow.style.top = '45%';
                
                await new Promise(r => setTimeout(r, 500));
                
                arrow.style.transition = "all 1.5s ease-in-out";
                arrow.style.left = '25%'; arrow.style.top = '45%';
                
                await new Promise(r => setTimeout(r, 2000));
                
                grid[4][5].hasTrack = false;
                grid[4][2].hasTrack = true;
                
                updateGridConnections();
                updateUI();
                arrow.style.display = 'none';
                
                await cinematicScene("Route connected. Commencing transit.");
            } else {
                for(let i=0; i<lvl+1; i++) {
                    passengers.push({x: Math.floor(Math.random()*8)+1, y: Math.floor(Math.random()*8)+1});
                }
                drawPassengers();
            }
            
            startGame();
        }

        function startGame() {
            isPlaying = true;
            trainBody.classList.add('is-moving');
            smokeInterval = setInterval(spawnSmoke, 250);
            runGameLoop();
        }

        function stopGame() {
            isPlaying = false;
            trainBody.classList.remove('is-moving');
            clearTimeout(moveTimeout);
            clearInterval(smokeInterval);
        }

        function spawnSmoke() {
            if(!isPlaying) return;
            const smoke = document.createElement('div');
            smoke.className = 'smoke-particle';
            smoke.style.left = `${(train.x * 10) + 5}%`;
            smoke.style.top = `${(train.y * 10) + 5}%`;
            boardEl.appendChild(smoke);
            setTimeout(() => { if(smoke.parentNode) smoke.remove(); }, 1500);
        }

        function runGameLoop() {
            if (!isPlaying) return;

            let nextX = train.x + train.dx;
            let nextY = train.y + train.dy;
            const hasTrack = (x, y) => x>=0 && x<gridSize && y>=0 && y<gridSize && grid[y][x].hasTrack;

            // If path directly ahead is blocked or ending, look for a 90-degree turn
            if (!hasTrack(nextX, nextY)) {
                let lDx = train.dy, lDy = -train.dx; // Left vector mapping
                let rDx = -train.dy, rDy = train.dx; // Right vector mapping

                if (hasTrack(train.x + lDx, train.y + lDy)) {
                    train.dx = lDx; train.dy = lDy;
                    train.rot -= 90; // Accumulate rotation negatively for left turn
                    executeTurn();
                    return;
                }
                else if (hasTrack(train.x + rDx, train.y + rDy)) {
                    train.dx = rDx; train.dy = rDy;
                    train.rot += 90; // Accumulate rotation positively for right turn
                    executeTurn();
                    return;
                }
                else {
                    derail();
                    return;
                }
            }

            // Normal Straight Movement
            train.x += train.dx;
            train.y += train.dy;
            updateTrainVisuals();
            checkPassengerAndContinue();
        }

        function executeTurn() {
            // Apply visual rotation immediately
            updateTrainVisuals();
            
            // Allow 1000ms (1 full second) to complete the pivot before moving to the next tile
            moveTimeout = setTimeout(() => {
                if (!isPlaying) return;
                train.x += train.dx;
                train.y += train.dy;
                updateTrainVisuals();
                checkPassengerAndContinue();
            }, 1000);
        }

        function checkPassengerAndContinue() {
            const pIdx = passengers.findIndex(p => p.x === train.x && p.y === train.y);
            if (pIdx !== -1) {
                passengers.splice(pIdx, 1);
                drawPassengers();
                if (passengers.length === 0) {
                    winLevel();
                    return;
                }
            }
            if (isPlaying) {
                // Slower, smoother straight movement matched with the CSS transition speed
                moveTimeout = setTimeout(runGameLoop, 800); 
            }
        }

        function derail() {
            stopGame();
            showModal("DERAILED", "Out of tracks! You must recycle tracks from behind the train to build ahead.", () => location.reload());
        }

        function winLevel() {
            stopGame();
            showModal("LEVEL COMPLETE", "Route cleared. Prepare for increased complexity.", () => loadLevel(level + 1));
        }

        function updateTrainVisuals(instant = false) {
            trainEl.style.display = 'flex';
            trainEl.style.transitionDuration = instant ? '0s' : '0.8s';
            trainEl.style.left = `${(train.x / gridSize) * 100}%`;
            trainEl.style.top = `${(train.y / gridSize) * 100}%`;
            trainEl.style.transform = `rotate(${train.rot}deg)`;
        }

        function drawPassengers() {
            document.querySelectorAll('.passenger').forEach(p => p.remove());
            passengers.forEach(p => {
                const pEl = document.createElement('div');
                pEl.className = 'passenger';
                grid[p.y][p.x].el.appendChild(pEl);
            });
        }

        function updateUI() {
            const count = grid.flat().filter(c => c.hasTrack).length;
            document.getElementById('track-count').innerText = count;
            document.getElementById('level-display').innerText = level;
        }

        function showModal(title, text, action) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-text').innerText = text;
            document.getElementById('modal-overlay').style.display = 'flex';
            pendingAction = action;
        }

        function modalAction() {
            document.getElementById('modal-overlay').style.display = 'none';
            if (pendingAction) pendingAction();
        }

        window.onload = () => loadLevel(1);
    </script>
</body>
</html>
