<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ball Craze - ClickSyncGames</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <header>
            <a href="/" id="return-btn">&larr; Return to ClickSyncGames</a>
            <div id="stats">
                <span id="score-display">0% cleared</span>
                <span id="level-display">Level 1</span>
                <span id="lives-display">Lives: 3/3</span>
            </div>
            <button id="pause-btn">Pause (P)</button>
        </header>

        <main>
            <div id="canvas-wrapper">
                <canvas id="gameCanvas" width="800" height="400"></canvas>
            </div>
            <button id="switch-dir-btn">
                <span class="btn-text">Switch<br>Direction</span>
                <span id="dir-arrow">&#8597;</span> </button>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
