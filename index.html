<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClickSyncGames</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #2c3e50;
        }

        .game-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }

        .game-card {
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            width: 250px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .game-card:hover {
            transform: scale(1.05);
        }

        .game-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 4px;
            background-color: #eee;
        }

        .game-card h3 {
            margin: 15px 0 10px 0;
            font-size: 1.2rem;
        }

        .game-card a {
            text-decoration: none;
            color: inherit;
        }
    </style>
</head>
<body>

    <header>
        <h1>ClickSyncGames</h1>
        <p>Choose a game below to start playing!</p>
    </header>

    <main class="game-grid">
        
        <!-- Save the Golf Balls Game -->
        <div class="game-card">
            <a href="savethegolfballs.html">
                <img src="savethegolfballsthumbnail.jpg" alt="Save the Golf Balls Thumbnail">
                <h3>Save the Golf Balls</h3>
            </a>
        </div>

        <!-- You can paste your older games right below here -->
        
        <!-- Example Placeholder for an older game -->
        <div class="game-card">
            <a href="yourothergame.html">
                <img src="placeholder.jpg" alt="Other Game">
                <h3>Your Other Game</h3>
            </a>
        </div>

    </main>

</body>
</html>
