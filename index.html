<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClickSyncGames - Play Free Online Games</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --header-bg: #111111;
            --text-color: #ffffff;
            --accent-color: #ff8c00; /* Vibrant Orange */
            --accent-hover: #e07b00;
            --card-bg: #2b2b2b;
            --card-outline: #000080; /* Dark blue outline */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--header-bg);
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid var(--accent-color);
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            color: white;
            -webkit-text-stroke: 1px var(--card-outline);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            letter-spacing: 2px;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .category-section {
            margin-bottom: 40px;
        }

        .category-title {
            font-size: 2rem;
            border-bottom: 2px solid var(--card-outline);
            padding-bottom: 10px;
            margin-bottom: 20px;
            color: var(--accent-color);
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        /* Game Card Styling */
        .game-card {
            background-color: var(--card-bg);
            border: 2px solid var(--card-outline);
            border-radius: 12px;
            overflow: hidden;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.6);
        }

        .game-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 2px solid var(--card-outline);
        }

        .game-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .game-title {
            margin: 0 0 15px 0;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .play-btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: 800;
            border: 1px solid var(--card-outline);
            transition: background 0.2s;
        }

        .play-btn:hover {
            background-color: var(--accent-hover);
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: var(--header-bg);
            margin-top: 40px;
            border-top: 1px solid #333;
        }
    </style>
</head>
<body>

    <header>
        <h1>ClickSyncGames</h1>
    </header>

    <main>
        <section class="category-section" id="arcade">
            <h2 class="category-title">Arcade</h2>
            <div class="game-grid">
                
                <div class="game-card">
                    <img src="tictactoe.jpg" alt="Impossible Tic Tac Toe Thumbnail">
                    <div class="game-info">
                        <h3 class="game-title">Impossible Tic Tac Toe</h3>
                        <a href="impossibletictactoe.html" class="play-btn">Play Now</a>
                    </div>
                </div>
                </div>
        </section>

        <section class="category-section" id="multiplayer">
            <h2 class="category-title">Multiplayer</h2>
            <div class="game-grid">
                
                <div class="game-card">
                    <img src="tictactoe.jpg" alt="Impossible Tic Tac Toe Thumbnail">
                    <div class="game-info">
                        <h3 class="game-title">Impossible Tic Tac Toe</h3>
                        <a href="impossibletictactoe.html" class="play-btn">Play Now</a>
                    </div>
                </div>
                </div>
        </section>

        <section class="category-section" id="puzzle">
            <h2 class="category-title">Puzzle</h2>
            <div class="game-grid">
                
                <div class="game-card">
                    <img src="tictactoe.jpg" alt="Impossible Tic Tac Toe Thumbnail">
                    <div class="game-info">
                        <h3 class="game-title">Impossible Tic Tac Toe</h3>
                        <a href="impossibletictactoe.html" class="play-btn">Play Now</a>
                    </div>
                </div>
                </div>
        </section>

        <section class="category-section" id="strategy">
            <h2 class="category-title">Strategy</h2>
            <div class="game-grid">
                
                <div class="game-card">
                    <img src="tictactoe.jpg" alt="Impossible Tic Tac Toe Thumbnail">
                    <div class="game-info">
                        <h3 class="game-title">Impossible Tic Tac Toe</h3>
                        <a href="impossibletictactoe.html" class="play-btn">Play Now</a>
                    </div>
                </div>
                </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ClickSyncGames. All rights reserved.</p>
    </footer>

</body>
</html>
