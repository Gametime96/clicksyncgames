<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClickSync Games | Premium Browser Games</title>
    <style>
        :root {
            --bg-color: #e5e7eb;
            --text-color: #0f172a;
            --panel-bg: #ffffff;
            --accent-blue: #2563eb;
            --search-bg: #f1f5f9;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--panel-bg);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container h1 {
            margin: 0;
            font-size: 32px;
            color: var(--text-color);
            letter-spacing: 1px;
            font-weight: 900;
            display: flex;
            align-items: flex-start;
        }

        .logo-container span { color: var(--accent-blue); }
        
        .tm-symbol {
            font-size: 14px;
            color: var(--text-color);
            margin-left: 2px;
            font-weight: bold;
        }

        .search-container {
            flex: 1;
            max-width: 500px; /* Widened search bar slightly for horizontal layout */
            margin-left: 40px;
            position: relative;
        }

        .search-bar {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #cbd5e1;
            border-radius: 25px;
            font-size: 16px;
            color: var(--text-color);
            background-color: var(--search-bg);
            outline: none;
        }

        /* Widened Main Layout to be more Horizontal */
        main {
            max-width: 1600px;
            width: 95%;
            margin: 40px auto;
            padding: 0 20px;
            flex: 1; 
        }

        h2.section-title {
            font-size
