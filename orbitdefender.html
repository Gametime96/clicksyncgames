<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Orbit Defender</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            user-select: none;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            font-size: 24px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .hud-bottom {
            text-align: center;
            font-size: 14px;
            color: #888;
        }

        #start-screen, #game-over-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border: 1px solid #333;
            border-radius: 10px;
            box-shadow: 0 0 50px rgba(0, 217, 255, 0.2);
            pointer-events: auto;
            backdrop-filter: blur(5px);
        }

        h1 { margin: 0 0 10px 0; color: #00d9ff; letter-spacing: 2px; }
        p { color: #ccc; line-height: 1.6; }
        
        button {
            background: transparent;
            color: #00d9ff;
            border: 2px solid #00d9ff;
            padding: 10px 30px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
            text-transform: uppercase;
            font-weight: bold;
        }

        button:hover {
            background: #00d9ff;
            color: black;
            box-shadow: 0 0 20px #00d9ff;
        }

        #energy-bar-container {
            width: 200px;
            height: 10px;
            background: #333;
            margin-top: 10px;
            border-radius: 5px;
            overflow: hidden;
        }

        #energy-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff0, #f00);
            transition: width 0.1s linear;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="hud-top">
            <div id="score-display">SCORE: 0</div>
            <div id="health-display">CORE: 100%</div>
        </div>
        <div class="hud-bottom">Move MOUSE to Rotate Shield • Click for SHOCKWAVE (Requires Energy)</div>
    </div>

    <div id="start-screen">
        <h1>ORBIT DEFENDER</h1>
        <p>Defend the Core.</p>
        <p><span style="color:#ff4444">RED ORBS</span> damage the core. <b>BLOCK THEM.</b></p>
        <p><span style="color:#44ff44">BLUE ORBS</span> heal the core. <b>LET THEM PASS.</b></p>
        <button onclick="startGame()">Initiate</button>
    </div>

    <div id="game-over-screen" class="hidden">
        <h1>CRITICAL FAILURE</h1>
        <p>Final Score: <span id="final-score" style="color:white">0</span></p>
        <button onclick="startGame()">Reboot System</button>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // Game State
    let isPlaying = false;
    let score = 0;
    let coreHealth = 100;
    let shockwaveEnergy = 0; // 0 to 100
    let frameCount = 0;
    let difficultyMultiplier = 1;

    // Dimensions
    let centerX, centerY;
    
    // Entities
    const player = {
        angle: 0,
        radius: 60,
        arcSize: 1.5 // Radians (approx 85 degrees)
    };

    let enemies = [];
    let particles = [];
    let shockwaves = [];

    // Audio Context (Simple Synth)
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        
        if (type === 'hit') { // Bad hit on shield (Good!)
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'heal') { // Good hit on core
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.linearRampToValueAtTime(600, now + 0.2);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'damage') { // Bad hit on core
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, now);
            osc.frequency.linearRampToValueAtTime(50, now + 0.3);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        } else if (type === 'shockwave') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.5);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
        }
    }

    // Resize Handling
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        centerX = canvas.width / 2;
        centerY = canvas.height / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    // Input Handling
    window.addEventListener('mousemove', (e) => {
        if (!isPlaying) return;
        const dx = e.clientX - centerX;
        const dy = e.clientY - centerY;
        player.angle = Math.atan2(dy, dx);
    });
    
    // Touch support
    window.addEventListener('touchmove', (e) => {
        if (!isPlaying) return;
        const t = e.touches[0];
        const dx = t.clientX - centerX;
        const dy = t.clientY - centerY;
        player.angle = Math.atan2(dy, dx);
    }, {passive: false});

    window.addEventListener('mousedown', tryShockwave);
    window.addEventListener('touchstart', tryShockwave);

    function tryShockwave() {
        if (!isPlaying) return;
        if (shockwaveEnergy >= 100) {
            shockwaves.push({ r: 10, maxR: Math.max(canvas.width, canvas.height), alpha: 1 });
            shockwaveEnergy = 0;
            playSound('shockwave');
            // Clear enemies
            enemies.forEach(e => createParticles(e.x, e.y, e.type === 'bad' ? '#ff4444' : '#44ff44'));
            enemies = [];
        }
    }

    function createParticles(x, y, color) {
        for(let i=0; i<8; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 5,
                vy: (Math.random() - 0.5) * 5,
                life: 1.0,
                color: color
            });
        }
    }

    function startGame() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        
        score = 0;
        coreHealth = 100;
        shockwaveEnergy = 0;
        difficultyMultiplier = 1;
        enemies = [];
        particles = [];
        shockwaves = [];
        isPlaying = true;
        
        requestAnimationFrame(loop);
    }

    function gameOver() {
        isPlaying = false;
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = score;
    }

    function spawnEnemy() {
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.max(canvas.width, canvas.height) / 1.5 + 50;
        const type = Math.random() > 0.3 ? 'bad' : 'good'; // 70% bad, 30% good
        
        let speed = (2 + Math.random() * 2) * difficultyMultiplier;
        
        enemies.push({
            x: centerX + Math.cos(angle) * dist,
            y: centerY + Math.sin(angle) * dist,
            vx: Math.cos(angle + Math.PI) * speed, // Move towards center
            vy: Math.sin(angle + Math.PI) * speed,
            type: type,
            rad: 8
        });
    }

    function loop() {
        if (!isPlaying) return;

        ctx.fillStyle = 'rgba(5, 5, 5, 0.3)'; // Trails
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        frameCount++;
        difficultyMultiplier = 1 + (score / 500);

        // Spawn Logic
        if (frameCount % Math.max(20, Math.floor(60 / difficultyMultiplier)) === 0) {
            spawnEnemy();
        }

        // Charge Logic (slowly build charge)
        if (shockwaveEnergy < 100) shockwaveEnergy += 0.1;

        // --- UPDATE ---

        // Update Shockwaves
        for (let i = shockwaves.length - 1; i >= 0; i--) {
            let s = shockwaves[i];
            s.r += 15;
            s.alpha -= 0.02;
            if (s.alpha <= 0) shockwaves.splice(i, 1);
        }

        // Update Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.05;
            if (p.life <= 0) particles.splice(i, 1);
        }

        // Update Enemies
        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            e.x += e.vx;
            e.y += e.vy;

            const dx = e.x - centerX;
            const dy = e.y - centerY;
            const dist = Math.sqrt(dx*dx + dy*dy);
            const angleToCenter = Math.atan2(dy, dx);

            // 1. Check Collision with Shield
            // We normalize angles to 0 - 2PI range for easy comparison
            let checkAngle = angleToCenter;
            // Shield logic: The shield is at 'player.angle'. 
            // We check if enemy distance is approx shield radius
            if (dist < player.radius + 10 && dist > player.radius - 10) {
                // Angle difference logic
                let angleDiff = Math.abs(checkAngle - player.angle);
                // Handle wrap-around (PI to -PI)
                if (angleDiff > Math.PI) angleDiff = 2 * Math.PI - angleDiff;

                if (angleDiff < player.arcSize / 2) {
                    // HIT SHIELD
                    if (e.type === 'bad') {
                        // Blocked successfully
                        score += 10;
                        shockwaveEnergy = Math.min(100, shockwaveEnergy + 5);
                        createParticles(e.x, e.y, '#ff4444');
                        playSound('hit');
                    } else {
                        // Accidental block of good orb
                        score -= 5;
                        createParticles(e.x, e.y, '#44ff44');
                        playSound('hit'); // Generic sound implies mistake
                    }
                    enemies.splice(i, 1);
                    continue;
                }
            }

            // 2. Check Collision with Core
            if (dist < 20) {
                if (e.type === 'bad') {
                    coreHealth -= 20;
                    playSound('damage');
                    createParticles(e.x, e.y, 'red');
                    // Shake screen effect (simple offset)
                    ctx.translate(Math.random()*10-5, Math.random()*10-5);
                    setTimeout(() => ctx.setTransform(1,0,0,1,0,0), 50);
                } else {
                    coreHealth = Math.min(100, coreHealth + 10);
                    score += 20;
                    playSound('heal');
                    createParticles(e.x, e.y, '#44ff44');
                }
                enemies.splice(i, 1);
                continue;
            }
        }

        if (coreHealth <= 0) gameOver();

        // --- DRAW ---

        // 1. Draw Shockwaves
        ctx.lineWidth = 5;
        shockwaves.forEach(s => {
            ctx.beginPath();
            ctx.arc(centerX, centerY, s.r, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(255, 255, 255, ${s.alpha})`;
            ctx.stroke();
        });

        // 2. Draw Core
        ctx.shadowBlur = 20;
        ctx.shadowColor = coreHealth > 50 ? '#00d9ff' : 'red';
        ctx.fillStyle = coreHealth > 50 ? 'white' : '#ffcccc';
        ctx.beginPath();
        ctx.arc(centerX, centerY, 15, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Core Health Ring
        ctx.beginPath();
        ctx.arc(centerX, centerY, 25, -Math.PI/2, (-Math.PI/2) + (Math.PI*2 * (coreHealth/100)));
        ctx.strokeStyle = coreHealth > 50 ? '#00d9ff' : 'red';
        ctx.lineWidth = 3;
        ctx.stroke();

        // 3. Draw Player Shield
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#00d9ff';
        ctx.strokeStyle = '#00d9ff';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(centerX, centerY, player.radius, player.angle - player.arcSize/2, player.angle + player.arcSize/2);
        ctx.stroke();
        ctx.shadowBlur = 0;

        // 4. Draw Enemies
        enemies.forEach(e => {
            ctx.fillStyle = e.type === 'bad' ? '#ff4444' : '#44ff44';
            ctx.shadowBlur = 10;
            ctx.shadowColor = ctx.fillStyle;
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.rad, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.shadowBlur = 0;

        // 5. Draw Particles
        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        });

        // UI Updates
        document.getElementById('score-display').innerText = `SCORE: ${Math.floor(score)}`;
        document.getElementById('health-display').innerText = `CORE: ${Math.floor(coreHealth)}%`;
        
        // Energy Bar Update (in UI layer, rendered via CSS)
        // Draw energy ring around player? Or just use the DOM bar
        // Let's use Canvas for a circular charge meter around the player shield
        if (shockwaveEnergy >= 100) {
            ctx.strokeStyle = `rgba(255, 255, 0, ${0.5 + Math.sin(frameCount * 0.2)*0.5})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(centerX, centerY, player.radius + 15, 0, Math.PI * 2);
            ctx.stroke();
        }

        requestAnimationFrame(loop);
    }
</script>
</body>
</html>
